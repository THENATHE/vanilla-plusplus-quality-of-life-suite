plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
group = 'com.thenathe'
repositories { maven { url = 'https://maven.nucleoid.xyz/' } }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
 compileOnly rootProject.fileTree('libs') { include '*.jar' }
 compileOnly rootProject.fileTree('libs/compile-only') { include 'defaulted-*.jar' }
}
processResources { inputs.property 'version', providers.provider { project.version.toString() }; filesMatching('fabric.mod.json') { expand(version:project.version, mc:'26.3', chalk:'3.2.1+26.3', polymer:'0.18.2+26.3') } }
tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'; options.release = 25
 if (providers.gradleProperty('compilerVersion').isPresent()) {
  javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(providers.gradleProperty('compilerVersion').get()) }
 }
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from('LICENSE') }
dependencies {
 implementation 'eu.pb4:polymer-core:0.18.2+26.3'
 implementation 'eu.pb4:polymer-resource-pack:0.18.2+26.3'
 implementation 'eu.pb4:polymer-virtual-entity:0.18.2+26.3'
}

version = '1.1.1+26.3'
base { archivesName = 'thenathe-suite-combined-compat' }
sourceSets.main.java.srcDir('../../src/main/java')
sourceSets.main.java.include('com/thenathe/combinedshim/**', 'com/thenathe/suite/network/**', 'com/thenathe/ssopolymer/**', 'com/thenathe/backpackcompat/**', 'com/thenathe/toolpouchcompat/**', 'com/thenathe/mapstitchcompat/**')
