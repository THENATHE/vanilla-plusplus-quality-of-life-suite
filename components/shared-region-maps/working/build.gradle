plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
version = '1.0.5-combo.1+mc26.3'
group = 'org.sharedregionmaps'
base { archivesName = 'shared-region-maps' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
apply from: 'qa.gradle'

if (project.hasProperty('javac')) {
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.executable = project.property('javac')
    }
}
