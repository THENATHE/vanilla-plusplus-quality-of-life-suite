plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
group = 'com.thenathe'
repositories { maven { url = 'https://maven.nucleoid.xyz/' } }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
 compileOnly rootProject.fileTree('libs') { include '*.jar' }
}
processResources { inputs.property 'version', providers.provider { project.version.toString() }; filesMatching('fabric.mod.json') { expand(version:project.version, mc:'26.3', chalk:'3.2.1+26.3', polymer:'0.18.2+26.3') } }
tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'; options.release = 25
 if (providers.gradleProperty('compilerVersion').isPresent()) {
  javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(providers.gradleProperty('compilerVersion').get()) }
 }
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from('LICENSE') }

version = '1.1.6+26.3'
base { archivesName = 'vanilla-plusplus-quality-of-life-suite' }
sourceSets.main.java.exclude('com/thenathe/suite/network/**')
dependencies {
 implementation project(':combined-compat')
 implementation 'com.terraformersmc:modmenu:21.0.0'
 implementation 'me.shedaniel.cloth:cloth-config-fabric:26.3.159'
}
repositories { maven { url = 'https://maven.terraformersmc.com/releases/' }; maven { url = 'https://maven.shedaniel.me/' } }
def bundled = fileTree('libs') {
 include 'sensible_stackables-fabric-*.jar', 'bannerpoint-fabric-*.jar', 'simple_smithing_overhaul-*.jar', 'tiered_backpacks-*.jar', 'toolpouch-fabric-*.jar', 'mapstitch-fabric-*.jar', 'misctweaks-*.jar', 'simple_death_improvements-*.jar', 'chalk-*.jar', 'chalk-colorful-addon-*.jar', 'amethyst-curse-cleanser-*.jar'
}
tasks.register('verifyInputs') {
 doLast {
  new groovy.json.JsonSlurper().parse(file('locks/artifacts.json')).each { entry ->
   def input = file(entry.file)
   if (!input.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() != entry.sha256) throw new GradleException("Pinned input mismatch: ${entry.file}")
  }
 }
}
tasks.named('compileJava') { dependsOn 'verifyInputs' }
['combined-compat', 'chalk-compat', 'shared-region-maps', 'toolpouch-atlas-elytra', 'mapstitch-mixed-scales', 'sensible-stackables-compat', 'bannerpoint-compat'].each { evaluationDependsOn(":${it}") }
subprojects { tasks.withType(JavaCompile).configureEach { dependsOn rootProject.tasks.named('verifyInputs') } }
def componentJars = ['combined-compat', 'chalk-compat', 'shared-region-maps', 'toolpouch-atlas-elytra', 'mapstitch-mixed-scales', 'sensible-stackables-compat', 'bannerpoint-compat'].collect { rootProject.project(":${it}").tasks.named('jar').flatMap { it.archiveFile } }
jar {
 dependsOn ':combined-compat:jar', ':chalk-compat:jar', ':shared-region-maps:jar', ':toolpouch-atlas-elytra:jar', ':mapstitch-mixed-scales:jar', ':sensible-stackables-compat:jar', ':bannerpoint-compat:jar'
 from(bundled) { into 'META-INF/jars' }
 from(componentJars) { into 'META-INF/jars' }
 from('licenses') { into 'META-INF/licenses' }
 from('locks') { into 'META-INF/thenathe-suite/locks' }
}
